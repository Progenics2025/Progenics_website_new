<script>
/* --- Reliable window.open interceptor for Shopify iframe --- */
(function(){
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.tagName === 'IFRAME' && node.name && node.name.indexOf('frame-product-') !== -1) {
          node.addEventListener('load', function() {
            try {
              node.contentWindow.open = function(url, target, features) {
                if (url && (url.indexOf('myshopify.com') !== -1 || url.indexOf('shopify.com') !== -1)) {
                  document.getElementById('checkout-frame').src = url;
                  document.getElementById('checkout-overlay').classList.add('active');
                  document.body.style.overflow = 'hidden';
                  return null;
                }
                return window.open(url, target, features);
              };
              
              node.contentWindow.document.addEventListener('click', function(e) {
                var btn = e.target.closest('.shopify-buy__btn');
                if (btn) {
                  var overlay = document.getElementById('checkout-overlay');
                  if (overlay) {
                    overlay.classList.add('active');
                    document.getElementById('checkout-frame').style.background = 'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' fill=\'none\' stroke=\'%23006eb8\' stroke-width=\'10\' r=\'35\' stroke-dasharray=\'164.933 56.977\'>  <animateTransform attributeName=\'transform\' type=\'rotate\' repeatCount=\'indefinite\' dur=\'1s\' values=\'0 50 50;360 50 50\' keyTimes=\'0;1\'></animateTransform></circle></svg>") center center no-repeat';
                    document.getElementById('checkout-frame').style.backgroundSize = '50px 50px';
                  }
                }
              }, true);
            } catch(e) {}
          });
        }
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>

      document.getElementById('checkout-frame').src = url;
      document.getElementById('checkout-overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
      return { closed: false, focus: function(){}, close: function(){} };
    }
    return _open.apply(this, arguments);
  };
  window.closeCheckout = function() {
    document.getElementById('checkout-overlay').classList.remove('active');
    document.getElementById('checkout-frame').src = '';
    document.body.style.overflow = '';

})();
